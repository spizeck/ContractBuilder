<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#319795">
  <title>Sea Saba Business — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #f7fafc; color: #1a202c; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 440px; }
    img { width: min(280px, 80vw); height: auto; margin-bottom: 32px; }
    h1 { margin: 0 0 12px; font-size: 1.75rem; }
    p { margin: 0 0 24px; line-height: 1.6; color: #4a5568; }
    button { min-height: 44px; border: 0; border-radius: 8px; padding: 12px 20px; background: #319795; color: white; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/SS_blue.svg" alt="Sea Saba">
    <h1>You’re offline</h1>
    <p>Sea Saba Business requires an internet connection for business and customer data. Reconnect, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
